services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: dental
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental -d dental"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - dental-postgres:/var/lib/postgresql/data
  web:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dental:local-only@database:5432/dental
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      REGULATED_DATA_KEY: ${REGULATED_DATA_KEY:?set REGULATED_DATA_KEY}
      AUTH_URL: http://localhost:3000
    ports: ["3000:3000"]
volumes:
  dental-postgres:
